name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - run: pnpm install --frozen-lockfile
      - run: pnpm render
      - run: pnpm check
      - run: pnpm exec astro build
      - run: pnpm build:theme
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: velcure-keycloak-theme
          path: artifacts/velcure-keycloak-theme.jar
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  account-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: docker compose up -d --build
      - name: Wait for the isolated realm
        run: curl --fail --silent --retry 40 --retry-all-errors --retry-delay 2 --max-time 5 http://127.0.0.1:8082/realms/velcure-preview/.well-known/openid-configuration > /dev/null
      - run: pnpm test:account
      - if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: account-playwright-report
          path: |
            playwright-report/account/
            test-results/
      - if: always()
        run: docker compose down --volumes

  optimized-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/test-optimized-image.sh
      - if: always()
        run: docker compose -f compose.optimized.yaml down --volumes --remove-orphans

  images:
    needs: [check, account-integration, optimized-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        name: Image metadata
        run: |
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "version=$(jq -r .version package.json)"
            echo "keycloak=$(jq -r .version keycloak-version.json)"
          } >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.metadata.outputs.image }}:main
            ${{ steps.metadata.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=Velcure Keycloak Theme
            org.opencontainers.image.description=Native Velcure login, account and email themes for Keycloak
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            org.opencontainers.image.licenses=LicenseRef-Velcure-Proprietary
            io.velcure.keycloak.version=${{ steps.metadata.outputs.keycloak }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  release:
    needs: [check, account-integration, optimized-image, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      app_client_id: ${{ vars.RELEASE_APP_CLIENT_ID }}
      image_digest: ${{ needs.images.outputs.digest }}
      commit_sha: ${{ github.sha }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
