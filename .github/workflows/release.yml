name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - run: node scripts/build-theme.mjs
      - run: gh release create "$GITHUB_REF_NAME" artifacts/velcure-keycloak-theme.jar --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/velcure/keycloak-theme:${{ github.ref_name }}
