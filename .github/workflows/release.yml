name: Release
on:
  workflow_call:
    inputs:
      app_client_id:
        required: true
        type: string
      image_digest:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: true
permissions: {}
concurrency:
  group: release-keycloak-theme
  cancel-in-progress: false
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: head
        name: Skip stale main runs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$EXPECTED_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi
      - id: release
        if: steps.head.outputs.current == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - id: resolve
        name: Resolve a stable release for this exact checked commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          EXPECTED_SHA: ${{ inputs.commit_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          # Also recovers a run that created the release but failed during publication.
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          fi
          if [ -z "$tag" ]; then exit 0; fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 0; fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          if [ "$sha" != "$EXPECTED_SHA" ]; then exit 0; fi
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo '::error::Missing digest from the checked CI image.'
            exit 1
          fi
          version="${tag#v}"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8.0.2
        if: steps.resolve.outputs.tag != ''
        with:
          name: velcure-keycloak-theme
          path: artifacts
      - name: Attach the checked theme JAR
        if: steps.resolve.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          (cd artifacts && sha256sum velcure-keycloak-theme.jar > SHA256SUMS)
          gh release upload "$TAG" artifacts/velcure-keycloak-theme.jar artifacts/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
      - uses: docker/setup-buildx-action@v4.4.1
        if: steps.resolve.outputs.tag != ''
      - uses: docker/login-action@v4.6.0
        if: steps.resolve.outputs.tag != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the exact CI image without rebuilding
        if: steps.resolve.outputs.tag != ''
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          DIGEST: ${{ inputs.image_digest }}
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
          MINOR: ${{ steps.resolve.outputs.minor }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:$MINOR" \
            --tag "$IMAGE:latest" \
            "$IMAGE@$DIGEST"
          actual=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{.Manifest.Digest}}')
          test "$actual" = "$DIGEST"
