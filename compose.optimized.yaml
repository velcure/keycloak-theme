name: velcure-theme-optimized-test
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: optimized-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 2s
      timeout: 3s
      retries: 30
  keycloak:
    build:
      context: .
      target: production
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: optimized-test-only
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://127.0.0.1:18082
    ports:
      - "127.0.0.1:18082:8080"
      - "127.0.0.1:19002:9000"
    volumes:
      - ./fixtures/realm:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
